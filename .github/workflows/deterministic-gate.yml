name: Qafila Deterministic Gate

on:
  pull_request:
    branches: [main]
    paths:
      - "qafila/**"
      - ".github/workflows/deterministic-gate.yml"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

defaults:
  run:
    shell: bash

jobs:
  deterministic-gate:
    name: Qafila Governance / deterministic-gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: qafila
      PYTHONDONTWRITEBYTECODE: "1"
      QAFILA_MODE: experimental_dry_run
      QAFILA_NETWORK_EGRESS: deny
    steps:
      # Pinned to actions/checkout v7.0.1 after review of the official release commit.
      - name: Checkout pull request source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Verify tracked fixtures are reproducible
        run: |
          set -euo pipefail
          python3 qafila/scripts/make_fixtures.py
          git diff --exit-code -- qafila/fixtures

      - name: GH-01 run A — valid event
        run: |
          set -euo pipefail
          rm -rf qafila/artifacts/ci/gh01-run-a
          python3 -m qafila_gate.cli \
            --policy qafila/policy/governance-policy.v1.json \
            --fixtures qafila/fixtures/positive \
            --artifacts qafila/artifacts/ci/gh01-run-a \
            --experiment-id GH-01 \
            --run-label ci-run-a \
            --expect allow

      - name: GH-01 run B — valid event
        run: |
          set -euo pipefail
          rm -rf qafila/artifacts/ci/gh01-run-b
          python3 -m qafila_gate.cli \
            --policy qafila/policy/governance-policy.v1.json \
            --fixtures qafila/fixtures/positive \
            --artifacts qafila/artifacts/ci/gh01-run-b \
            --experiment-id GH-01 \
            --run-label ci-run-b \
            --expect allow
          python3 qafila/scripts/compare_runs.py \
            --left qafila/artifacts/ci/gh01-run-a/benchmark.csv \
            --right qafila/artifacts/ci/gh01-run-b/benchmark.csv \
            --out qafila/artifacts/ci/determinism.diff.json

      - name: GH-02 — negative fail-closed suite
        run: |
          set -euo pipefail
          rm -rf qafila/artifacts/ci/gh02-negative
          python3 -m qafila_gate.cli \
            --policy qafila/policy/governance-policy.v1.json \
            --fixtures qafila/fixtures/negative \
            --artifacts qafila/artifacts/ci/gh02-negative \
            --experiment-id GH-02 \
            --run-label ci-negative-suite \
            --expect hold
          test "$(wc -l < qafila/artifacts/ci/gh02-negative/hold_register.jsonl)" -eq 10

      - name: G-3 — build evidence coverage candidate
        run: |
          set -euo pipefail
          python3 qafila/scripts/build_evidence_coverage.py \
            --artifact-root qafila/artifacts/ci \
            --policy qafila/policy/governance-policy.v1.json \
            --schema qafila/schemas/qafila-event.v1.schema.json \
            --out-md qafila/artifacts/ci/evidence_coverage.candidate.md \
            --out-json qafila/artifacts/ci/evidence_coverage.candidate.json

      - name: Publish governance evidence
        if: always()
        # Pinned to actions/upload-artifact v7.0.1 after review of the official release commit.
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: qafila-governance-evidence-${{ github.run_id }}
          if-no-files-found: error
          path: |
            qafila/artifacts/ci/**

      - name: Publish check summary
        if: always()
        run: |
          {
            echo "## Qafila Deterministic Gate"
            echo
            echo "- Mode: \`experimental_dry_run\`"
            echo "- Network egress: \`deny\`"
            echo "- GH-01: two local deterministic runs compared"
            echo "- GH-02: 10 negative fixtures must be held"
            echo "- G-3: evidence coverage candidate generated as an artifact only"
            echo "- Evidence: downloadable workflow artifact only; this workflow does not write commits, issues, or pull requests."
          } >> "$GITHUB_STEP_SUMMARY"
